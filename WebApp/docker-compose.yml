version: '3.8'

services:
  # 1. The PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: inventory_db
    restart: unless-stopped
    environment:
      # Pulling secure credentials from your .env file
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Named volume ensures your data survives container restarts
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Python Flask API
  backend:
    build: ./backend
    container_name: inventory_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Securely connecting to the 'db' container using .env variables
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  # 3. The React + Vite Frontend (Served via Nginx)
  frontend:
    build: ./webapp
    container_name: inventory_frontend
    restart: unless-stopped
    ports:
      - "5173:80" # Maps your local port 5173 to Nginx's internal port 80
    depends_on:
      - backend

# Declare the named volume for persistence
volumes:
  pgdata: